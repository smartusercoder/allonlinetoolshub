<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="200" fill="white" fill-opacity="0.05"/>
  <circle cx="100" cy="530" r="150" fill="white" fill-opacity="0.05"/>
  
  <!-- Logo icon -->
  <rect x="100" y="200" width="80" height="80" rx="16" fill="white"/>
  <path d="M125 240 L155 240 L155 260 L125 260 Z M135 225 L145 225 L145 240 L135 240 Z M130 260 L150 260 L150 275 L130 275 Z" fill="#3b82f6"/>
  
  <!-- Title -->
  <text x="200" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="white">All Online Tools Hub</text>
  
  <!-- Subtitle -->
  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="white" fill-opacity="0.9">1500+ Free Online Tools</text>
  
  <!-- Description -->
  <text x="100" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="white" fill-opacity="0.7">Image • PDF • Text • Code • SEO • Converters</text>
  
  <!-- Features -->
  <g transform="translate(100, 450)">
    <rect width="160" height="50" rx="8" fill="url(#card-gradient)" stroke="white" stroke-opacity="0.2"/>
    <text x="80" y="32" font-family="system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle">✓ No Signup</text>
  </g>
  <g transform="translate(280, 450)">
    <rect width="160" height="50" rx="8" fill="url(#card-gradient)" stroke="white" stroke-opacity="0.2"/>
    <text x="80" y="32" font-family="system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle">✓ 100% Free</text>
  </g>
  <g transform="translate(460, 450)">
    <rect width="160" height="50" rx="8" fill="url(#card-gradient)" stroke="white" stroke-opacity="0.2"/>
    <text x="80" y="32" font-family="system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle">✓ Privacy First</text>
  </g>
  <g transform="translate(640, 450)">
    <rect width="180" height="50" rx="8" fill="url(#card-gradient)" stroke="white" stroke-opacity="0.2"/>
    <text x="90" y="32" font-family="system-ui, sans-serif" font-size="16" fill="white" text-anchor="middle">✓ Browser-Based</text>
  </g>
  
  <!-- URL -->
  <text x="100" y="570" font-family="system-ui, sans-serif" font-size="20" fill="white" fill-opacity="0.6">allonlinetoolshub.com</text>
